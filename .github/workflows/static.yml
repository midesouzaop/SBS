# Deploy the Do Zero a S.A. frontend from its isolated platform branch.
name: Deploy Do Zero a S.A. to Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform branch
        uses: actions/checkout@v4
        with:
          ref: feat/do-zero-sa-platform
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload platform frontend only
        uses: actions/upload-pages-artifact@v3
        with:
          path: do-zero-sa
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
