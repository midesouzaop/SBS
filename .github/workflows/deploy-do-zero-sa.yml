name: Deploy Do Zero a S.A. preview
on:
  push:
    branches:
      - feat/do-zero-sa-platform
    paths:
      - "do-zero-sa/**"
      - ".github/workflows/deploy-do-zero-sa.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview-v2
  cancel-in-progress: true
jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: do-zero-sa
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
