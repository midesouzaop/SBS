name: Validate Do Zero a S.A. site

on:
  push:
    branches:
      - feat/do-zero-sa-platform
    paths:
      - "do-zero-sa/**"
      - ".github/workflows/deploy-do-zero-sa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-do-zero-sa
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site entry point
        run: test -s do-zero-sa/index.html

      - name: Verify application scripts
        run: |
          test -s do-zero-sa/app.js
          test -s do-zero-sa/remote.js

      - name: Verify local asset references
        run: |
          grep -q 'app.js' do-zero-sa/index.html
          grep -q 'remote.js' do-zero-sa/index.html
